apiVersion: v1
kind: Configmap
metadata:
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: user
data:
  REDIS_URL: "redis://redis:6379"
  MONGO_URL: "mongodb://mongodb:27017/users"
  MONGO: "true"
---  
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: user
  namespace: roboshop
  # these labels are replicaset labels
  labels:
    project: roboshop
    tier: backend
    component: user
spec:
  replicas: 1
  selector:
    # using these labels replica set selects the pod
    matchLabels:
      project: roboshop
      tier: backend
      component: user
  # This is pod definition, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: user
    spec:
      containers:
      - name: user
        image: naveen678/user:1.0.0
        imagePullPolicy: Always                         # safe to pull everytime, there might be images with same version rebuilt and pushed 
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "100m"
        redinessProbe:
            #httpGet:
            ##port: 8080
          tcpSocket:
            port: 8080  
          failureThershold: 2                            #after how many hits it should be failure
          periodSeconds: 10                              #every 10sec healhth check should run
          initialDelaySeconds: 15                        #health can be ignored for first 15sec while creating
        livenessProbe:
          httpGet:
             path: /health
             port: 8088
          failureThreshold: 2                            #after how many hits it should be failure
          periodSeconds: 10                              #every 10sec healhth check should run 
                                                               
        envFrom:
         - configMapRef:
             name: user
---
apiVersion: v1                                            #clusterip
kind: Service
metadata: 
  name: user
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: user
spec:
  selector:
    project: roboshop                                      #labels are used as selectors
    tier: backend
    component: user 
  ports: 
  - protocol: TCP
    port: 8080 # service port
    targetPort: 8080 # container port         