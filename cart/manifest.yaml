apiversion: v1
kind: Configmap
metadata:
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: cart
data:
  REDIS_HOST: "redis"
  CATALOGUE_HOST: "catalogue"
  CATALOGUE_PORT: "8080"
---  
apiVersion: apps/v1 
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
  # these labels are replicaset labels
  labels:
    project: roboshop
    tier: backend
    component: cart
spec:
  replicas: 1
  selector:
    # using these labels replica set selects the pod
    matchLabels:
      project: roboshop
      tier: backend
      component: cart
  # This is pod definition, pod is subset of replicaset
  template:
    metadata:
      labels:
        project: roboshop
        tier: backend
        component: cart
    spec:
      containers:
      - name: nginx
        image: naveen678/cart:1.0.0
        imagepullpolicy: Always                         # safe to pull everytime, there might be images with same version rebuilt and pushed 
        resources:
          requests:
          memory: "128Mi"
          cpu: "100m"
        limits:
          memory: "128Mi"
          cpu: "100m"

        redinessprobe:
          #httpGet:
            ##port: 8080
          tcp socket:
            port: 8080  
          failureThershold: 2                            #after how many hits it should be failure
          periodseconds: 10                              #every 10sec healhth check should run
          initialDelaySeconds: 15                        #health can be ignored for first 15sec while creating
        livenessprobe:
          httpGet:
             path: /health
             port: 8088
          failureThershold: 2                            #after how many hits it should be failure
          periodseconds: 10                              #every 10sec healhth check should run 
                                                               
        envfrom:
         - configmapRef:
             name: cart
---
apiversion: v1                                            #clusterip
kind: Service
metadata: 
  name: cart
  namespace: roboshop
  labels:
    project: roboshop
    tier: backend
    component: cart
spec:
  selector:
    project: roboshop                                      #labels are used as selectors
    tier: backend
    component: cart 
  ports: 
  - protocol: TCP
    port: 8080 # service port
    targetPort: 8080 # container port        